<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d14">
  <meta name="description" content="Book detailing slots, track your service and collect loyalty points at NOIR Auto Atelier.">
  <title>Dashboard — NOIR Auto Atelier</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23eef1f7'/%3E%3Cstop offset='1' stop-color='%237d93c9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%230a0d14'/%3E%3Crect x='3' y='3' width='58' height='58' rx='12' fill='none' stroke='url(%23g)' stroke-opacity='.45' stroke-width='1.5'/%3E%3Cpath d='M18 40V16h5.5L40 34V16h6v24h-5.5L24 22v18z' fill='url(%23g)'/%3E%3Cpath d='M9 50c3-5 7-7 12-7h22c5 0 9 2 12 7' fill='none' stroke='%237d93c9' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='50' r='3' fill='%23d5dbe8'/%3E%3Ccircle cx='43' cy='50' r='3' fill='%23d5dbe8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== Dashboard shell ===== */
    body.dash-app { font-size: 16px; line-height: 1.6; }
    .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .dx-shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }

    /* Sidebar */
    .dx-side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg-soft); border-inline-end: 1px solid var(--line); z-index: 70; transition: background-color .45s; }
    .dx-side .brand { padding: 22px 24px; border-bottom: 1px solid var(--line); }
    .dx-nav { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 18px 14px; }
    .dx-nav button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 16px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-weight: 600; font-size: 16px; text-align: start; cursor: pointer; transition: background .25s, color .25s; }
    .dx-nav button:hover { color: var(--text); background: var(--panel); }
    .dx-nav button.active { color: var(--text); background: color-mix(in srgb, var(--gold) 14%, transparent); box-shadow: inset 3px 0 0 var(--secondary); }
    html[dir="rtl"] .dx-nav button.active { box-shadow: inset -3px 0 0 var(--secondary); }
    .dx-nav button.active .ic { color: var(--gold); }
    .dx-side-foot { padding: 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
    .dx-mini { display: block; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); text-align: start; cursor: pointer; transition: border-color .25s; }
    .dx-mini:hover { border-color: var(--gold); }
    .dx-mini small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .dx-mini strong { font: 700 24px "Syne", sans-serif; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .dx-mini span { font-size: 13px; color: var(--muted); margin-inline-start: 6px; }
    .dx-signout { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 15px; border-radius: 12px; cursor: pointer; }
    .dx-signout:hover { color: var(--text); background: var(--panel); }

    /* Top bar */
    .dx-main { min-width: 0; }
    .dx-top { position: sticky; top: 0; z-index: 40; height: 84px; display: flex; align-items: center; gap: 16px; padding: 0 clamp(20px, 3vw, 44px); background: var(--header); backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); }
    .dx-top h1 { flex: 1; margin: 0; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.2; letter-spacing: -.01em; font-weight: 700; }
    .dx-top .icon-btn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-soft); color: var(--text); transition: border-color .25s, color .25s; }
    .dx-top .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
    .dx-top .rtl-toggle { width: auto; padding: 0 14px; font-size: 12px; font-weight: 800; }
    .dx-menu { display: none !important; }
    .dx-user { display: flex; align-items: center; gap: 12px; padding: 4px 6px 4px 4px; border: 0; background: transparent; cursor: pointer; text-align: start; color: var(--text); }
    .dx-avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #0a0d14; font: 700 16px "Syne", sans-serif; }
    body.light-theme .dx-avatar { color: #fff; }
    .dx-user b { display: block; font-size: 15px; line-height: 1.2; }
    .dx-user small { color: var(--muted); font-size: 13px; }

    .dx-content { padding: clamp(22px, 3vw, 44px); max-width: 1400px; }
    .dx-scrim { display: none; }

    /* Typography inside content */
    .dx-hello h2 { font-size: clamp(28px, 3.2vw, 40px); margin: 0 0 6px; letter-spacing: -.02em; line-height: 1.15; font-weight: 700; }
    .dx-hello p { margin: 0 0 26px; color: var(--muted); font-size: 17px; max-width: 720px; }
    .dx-card { border: 1px solid var(--line); border-radius: 20px; background: var(--panel); padding: 26px; transition: background-color .45s, border-color .3s; }
    .dx-card h3 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
    .dx-sub { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
    .dx-meta { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
    .dx-id { margin: 0 0 4px; font-size: 12px; letter-spacing: .14em; color: var(--secondary); font-weight: 700; }
    .dx-stack { display: grid; gap: 22px; }

    /* Stats */
    .dx-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 22px; }
    .dx-stat { padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; min-height: 150px; transition: transform .3s var(--ease), border-color .3s; }
    .dx-stat:hover { transform: translateY(-4px); border-color: var(--gold); }
    .dx-stat.hl { border-color: var(--gold); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent); }
    .dx-stat span { color: var(--muted); font-size: 15px; }
    .dx-stat strong { margin-top: auto; font: 700 clamp(28px, 2.6vw, 38px) "Syne", sans-serif; line-height: 1.1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .dx-stat small { color: var(--muted); font-size: 14px; }

    .dx-grid2 { display: grid; grid-template-columns: 1.7fr 1fr; gap: 22px; margin-bottom: 22px; align-items: start; }
    .dx-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }

    /* Badges */
    .dx-badge { display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .dx-badge.ok { background: color-mix(in srgb, #2fbf7a 18%, transparent); border-color: #2fbf7a; color: #2fbf7a; }
    .dx-badge.warn { background: color-mix(in srgb, #e0a93b 16%, transparent); border-color: #e0a93b; color: #e0a93b; }
    .dx-badge.bad { background: color-mix(in srgb, #e66a6a 16%, transparent); border-color: #e66a6a; color: #e66a6a; }
    .dx-badge.info { border-color: var(--secondary); color: var(--secondary); }
    body.light-theme .dx-badge.ok { color: #12794a; }
    body.light-theme .dx-badge.warn { color: #8a5f00; }
    body.light-theme .dx-badge.bad { color: #b02a2a; }

    /* Tracker */
    .dx-track { list-style: none; padding: 0; margin: 26px 0 8px; display: grid; grid-template-columns: repeat(7, 1fr); }
    .dx-track li { position: relative; text-align: center; padding-top: 38px; font-size: 13px; line-height: 1.3; color: var(--muted); }
    .dx-track li i { position: absolute; top: 4px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg-soft); z-index: 1; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; color: #0a0d14; }
    .dx-track li:after { content: ""; position: absolute; top: 14px; left: -50%; width: 100%; height: 2px; background: var(--line); }
    .dx-track li:first-child:after { display: none; }
    .dx-track li.done i { background: var(--grad); border-color: transparent; }
    body.light-theme .dx-track li.done i { color: #fff; }
    .dx-track li.done:after, .dx-track li.now:after { background: var(--gold); }
    .dx-track li.now { color: var(--text); font-weight: 700; }
    .dx-track li.now i { border-color: var(--gold); box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 26%, transparent); }
    html[dir="rtl"] .dx-track li:after { left: auto; right: -50%; }
    .dx-note { margin: 14px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--bg-soft); color: var(--text); font-size: 15px; }
    .dx-pbar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 14px 0 0; }
    .dx-pbar span { display: block; height: 100%; background: var(--grad); border-radius: 99px; transition: width .6s var(--ease); }

    /* Lists */
    .dx-list { list-style: none; margin: 0; padding: 0; }
    .dx-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
    .dx-list li:last-child { border: 0; padding-bottom: 0; }
    .dx-list small { display: block; color: var(--muted); font-size: 13px; }
    .dx-list .due-bad { color: #e66a6a; } .dx-list .due-warn { color: #e0a93b; } .dx-list .due-ok { color: #2fbf7a; }
    .dx-empty { text-align: center; padding: 36px 20px; }
    .dx-empty p { color: var(--muted); max-width: 460px; margin: 0 auto 20px; }
    .dx-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .dx-actions .button { gap: 10px; }
    .dx-danger { color: #e66a6a !important; }
    .dx-danger:hover { border-color: #e66a6a !important; }

    /* Booking cards */
    .dx-bk { margin-bottom: 22px; }
    .dx-bk-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
    .dx-foot-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 15px; color: var(--muted); }
    .dx-foot-row span:last-child { color: var(--gold); font-weight: 600; }
    .dx-hist { margin-top: 12px; font-size: 15px; }
    .dx-hist summary { cursor: pointer; color: var(--muted); font-weight: 600; }
    .dx-hist ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
    .dx-hist li { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
    .dx-hist li b { color: var(--text); font-weight: 600; }

    /* Forms inside dashboard */
    .dx-main input:not([type=checkbox]):not([type=radio]), .dx-main select, .dx-main textarea, .dx-modal-box input:not([type=checkbox]), .dx-modal-box select { width: 100%; margin: 0; min-height: 46px; padding: 10px 14px; border-radius: 12px; font-size: 15px; background: var(--bg-soft); border: 1px solid var(--line); color: var(--text); outline: none; }
    .dx-main textarea { min-height: 90px; resize: vertical; font: inherit; }
    .dx-main input:focus, .dx-main select:focus, .dx-main textarea:focus { border-color: var(--gold); }
    .dx-main input[type=checkbox], .dx-main input[type=radio] { width: auto; min-height: 0; margin: 0; accent-color: var(--gold); }
    .dx-lab { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 600; color: var(--text); }
    .dx-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .dx-fields .full { grid-column: 1 / -1; }

    /* Booking flow */
    .dx-book { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
    .dx-book-main { display: grid; gap: 22px; }
    .dx-step { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-inline-end: 10px; border-radius: 50%; background: var(--grad); color: #0a0d14; font: 700 14px "Syne", sans-serif; }
    body.light-theme .dx-step { color: #fff; }
    .dx-card > h3 { margin-bottom: 16px; display: flex; align-items: center; }
    .dx-vehicles, .dx-svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .dx-choice { position: relative; display: block; margin: 0; cursor: pointer; }
    .dx-choice input { position: absolute; opacity: 0; width: 0; height: 0; }
    .dx-cbody { display: flex; justify-content: space-between; align-items: center; gap: 12px; height: 100%; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-soft); transition: all .25s; }
    .dx-choice:hover .dx-cbody { border-color: var(--gold); }
    .dx-choice input:checked + .dx-cbody { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--bg-soft)); }
    .dx-choice input:focus-visible + .dx-cbody { outline: 2px solid var(--gold); outline-offset: 2px; }
    .dx-cbody b { display: block; font-size: 16px; color: var(--text); }
    .dx-cbody small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
    .dx-price { color: var(--gold); font-weight: 700; white-space: nowrap; }
    .dx-newveh { margin-top: 16px; }
    .dx-newveh[hidden] { display: none; }

    .dx-dates { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; }
    .dx-date { flex: 0 0 76px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-soft); color: var(--text); cursor: pointer; transition: all .25s; }
    .dx-date b { font: 700 22px "Syne", sans-serif; }
    .dx-date small { font-size: 12px; color: var(--muted); }
    .dx-date:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-2px); }
    .dx-date.sel { background: var(--grad); border-color: transparent; color: #0a0d14; }
    .dx-date.sel small { color: inherit; opacity: .8; }
    body.light-theme .dx-date.sel { color: #fff; }
    .dx-date:disabled { opacity: .4; cursor: not-allowed; }
    .dx-hint { color: var(--muted); font-size: 15px; margin: 6px 0 12px; }
    .dx-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .dx-slot { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-soft); color: var(--text); font-weight: 600; font-size: 15px; cursor: pointer; transition: all .25s; }
    .dx-slot small { font-weight: 400; font-size: 12px; color: var(--muted); }
    .dx-slot:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-2px); }
    .dx-slot.sel { background: var(--grad); color: #0a0d14; border-color: transparent; }
    .dx-slot.sel small { color: inherit; opacity: .8; }
    body.light-theme .dx-slot.sel { color: #fff; }
    .dx-slot:disabled { opacity: .45; cursor: not-allowed; }
    .dx-check { display: flex; align-items: center; gap: 12px; margin: 18px 0 0; font-size: 15px; color: var(--text); cursor: pointer; }

    .dx-summary { position: sticky; top: 104px; }
    .dx-summary h3 { margin-bottom: 14px; }
    .dx-lines { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 10px; }
    .dx-lines li { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); font-size: 15px; }
    .dx-lines li.empty { color: var(--muted); border: 0; }
    .dx-row { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 10px; color: var(--muted); font-size: 15px; }
    .dx-total { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 6px; }
    .dx-total strong { font: 700 clamp(30px, 3vw, 40px) "Syne", sans-serif; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .dx-earn { color: var(--gold); font-size: 15px; margin: 0 0 14px; }
    .dx-slotline { font-weight: 600; margin: 12px 0 4px; }
    .dx-summary small { display: block; margin-top: 12px; color: var(--muted); font-size: 13px; }
    .dx-summary .button-full { justify-content: space-between; }

    /* Loyalty */
    .dx-points { font: 700 clamp(46px, 6vw, 72px)/1 "Syne", sans-serif; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 8px 0 6px; }
    .dx-points small { font-size: .3em; letter-spacing: .1em; }
    .dx-meter { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 18px 0 10px; }
    .dx-meter span { display: block; height: 100%; background: var(--grad); border-radius: 99px; transition: width .6s var(--ease); }
    .dx-tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 22px 0; }
    .dx-tier.current { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
    .dx-tier ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px; }
    .dx-tier li:before { content: "✓ "; color: var(--secondary); font-weight: 700; }
    .dx-rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 16px; }
    .dx-reward { display: flex; flex-direction: column; gap: 8px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-soft); }
    .dx-reward p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
    .dx-reward b { font: 700 22px "Syne", sans-serif; color: var(--gold); }
    .dx-voucher { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border: 1px dashed var(--gold); border-radius: 14px; margin-top: 12px; }
    .dx-voucher code { font: 700 16px "Syne", sans-serif; letter-spacing: .08em; color: var(--gold); }
    .dx-voucher.used { opacity: .5; border-color: var(--line); }
    .dx-ledger { list-style: none; margin: 12px 0 0; padding: 0; }
    .dx-ledger li { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px dashed var(--line); }
    .dx-ledger li:last-child { border: 0; }
    .dx-ledger small { display: block; color: var(--muted); font-size: 13px; }
    .dx-ledger b { font-size: 18px; white-space: nowrap; }
    .dx-ledger .pos { color: #2fbf7a; } .dx-ledger .neg { color: #e66a6a; }
    .dx-ref { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .dx-ref code { padding: 12px 16px; border: 1px dashed var(--gold); border-radius: 12px; font: 700 18px "Syne", sans-serif; letter-spacing: .1em; color: var(--gold); }

    /* Garage / history / settings */
    .dx-cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-bottom: 22px; }
    .dx-car h3 { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .dx-car dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
    .dx-car dt { color: var(--muted); } .dx-car dd { margin: 0; text-align: end; }
    .dx-tablewrap { overflow-x: auto; }
    .dx-table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 15px; }
    .dx-table th, .dx-table td { padding: 15px 14px; text-align: start; border-bottom: 1px solid var(--line); }
    .dx-table th { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .dx-table tr:last-child td { border-bottom: 0; }
    .dx-toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px dashed var(--line); cursor: pointer; margin: 0; color: var(--text); font-size: 16px; }
    .dx-toggle:last-of-type { border: 0; }
    .dx-toggle small { display: block; color: var(--muted); font-size: 13px; }
    .dx-switch { appearance: none; -webkit-appearance: none; width: 46px !important; height: 26px; min-height: 0 !important; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex: 0 0 46px; transition: background .25s; }
    .dx-switch:after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .25s; }
    .dx-switch:checked { background: var(--gold); }
    .dx-switch:checked:after { transform: translateX(20px); }
    html[dir="rtl"] .dx-switch:checked:after { transform: translateX(-20px); }

    /* Modal */
    .dx-modal { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 20px; background: rgba(5, 6, 10, .72); backdrop-filter: blur(8px); overflow-y: auto; }
    .dx-modal[hidden] { display: none; }

  <script>
  (function () {
    "use strict";
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

    /* ---------- helpers ---------- */
    var KEY = "noir-dash-v1";
    var store = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
    };
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function money(n) { return "₹" + Math.round(n).toLocaleString("en-IN"); }
    function num(n) { return Math.round(n).toLocaleString("en-IN"); }
    function uid(p) { return p + Math.random().toString(36).slice(2, 7).toUpperCase(); }
    function toast(msg) {
      var t = $("#toast"); if (!t) return;
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 3000);
    }

    var pad = function (n) { return String(n).padStart(2, "0"); };
    var iso = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
    var parse = function (s) { return new Date(s + "T00:00:00"); };
    var todayISO = function () { return iso(new Date()); };
    var addDays = function (s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
    var diffDays = function (a, b) { return Math.round((parse(a) - parse(b)) / 864e5); };
    var fmtDate = function (s) { return parse(s).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" }); };
    var fmtLong = function (s) { return parse(s).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); };
    var fmtTs = function (t) { return new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); };
    var isSunday = function (s) { return parse(s).getDay() === 0; };
    function slotHour(t) { var m = t.match(/(\d+):(\d+) (AM|PM)/); var h = (+m[1]) % 12; if (m[3] === "PM") h += 12; return h; }
    function ago(t) {
      var m = Math.round((Date.now() - t) / 6e4);
      if (m < 1) return "just now"; if (m < 60) return m + " min ago";
      var h = Math.round(m / 60); if (h < 24) return h + " h ago";
      return Math.round(h / 24) + " d ago";
    }
    function nextOpenDate(from) { var d = from; while (isSunday(d)) d = addDays(d, 1); return d; }

    /* ---------- catalogue ---------- */
    var SERVICES = [
      { id: "ceramic", name: "Ceramic coating", price: 24999, days: 3, note: "Up to 5-year protection" },
      { id: "correction", name: "Paint correction", price: 8499, days: 2, note: "Removes swirls and haze" },
      { id: "interior", name: "Interior atelier", price: 5999, days: 1, note: "Deep clean and condition" },
      { id: "full", name: "Full detail package", price: 32999, days: 5, note: "Correction + coating + interior" },
      { id: "ppf", name: "Paint protection film", price: 39999, days: 3, note: "Self-healing, up to 8 years" },
      { id: "tint", name: "Ceramic window tint", price: 12999, days: 1, note: "Up to 70% heat rejection" },
      { id: "wheel", name: "Wheel & glass protection", price: 3499, days: 1, note: "Repels water and brake dust" },
      { id: "engine", name: "Engine bay detail", price: 2499, days: 1, note: "Safe clean and dress" },
      { id: "wash", name: "Maintenance wash", price: 1499, days: 1, note: "Foam wash, dry and dressing" }
    ];
    var SIZES = { "Hatchback": 1, "Sedan": 1.15, "SUV": 1.3, "Luxury / sports": 1.5 };
    var STAGES = ["Requested", "Confirmed", "Vehicle received", "In treatment", "Quality check", "Ready for pickup", "Completed"];
    var NOTES = [
      "Request received. The studio will confirm your slot shortly.",
      "Slot confirmed. Bring your car on the day, or we will collect it if you chose pickup.",
      "Your vehicle has arrived and has been inspected.",
      "Treatment is underway in our climate-controlled bay.",
      "Final inspection under swirl-finder lighting.",
      "All done. Your car is ready for pickup.",
      "Completed. Thank you, your points have been added."
    ];
    var SLOTS = ["09:00 AM", "11:00 AM", "01:00 PM", "03:00 PM", "05:00 PM"];
    var PICKUP_FEE = 799;
    var TIERS = [
      { name: "Silver", min: 0, mult: 1, perks: ["5 points per ₹100 spent", "Free first maintenance wash with a full package", "Progress updates at every stage"] },
      { name: "Gold", min: 2500, mult: 1.25, perks: ["1.25× points on every booking", "Priority slot scheduling", "Complimentary tyre dressing"] },
      { name: "Platinum", min: 6000, mult: 1.5, perks: ["1.5× points on every booking", "Free doorstep pickup and drop", "Annual coating inspection included"] }
    ];
    var REWARDS = [
      { id: "r1", name: "Tyre dressing & fragrance", cost: 300, desc: "Added to any visit." },
      { id: "r2", name: "Free maintenance wash", cost: 600, desc: "Foam wash, dry and dressing." },
      { id: "r3", name: "₹1,000 service credit", cost: 1000, desc: "Applied to your next invoice at the studio." },
      { id: "r4", name: "Wheel & glass protection", cost: 1800, desc: "Full wheel and glass coating, on us." }
    ];

    /* ---------- user + state ---------- */
    function readUser() {
      var raw = store.get("noir-user"); if (!raw) return { name: "Guest", email: "guest@noiratelier.example" };
      var u; try { u = JSON.parse(raw); } catch (e) { u = null; }
      if (!u || typeof u !== "object") u = { email: String(raw) };
      if (!u.email) u.email = "guest@noiratelier.example";
      if (!u.name) {
        var l = u.email.split("@")[0].replace(/[._-]+/g, " ").trim();
        u.name = l.replace(/\b\w/g, function (c) { return c.toUpperCase(); }) || "Guest";
      }
      return u;
    }

    var S;
    function save() { store.set(KEY, JSON.stringify(S)); }
    function balance() { return S.ledger.reduce(function (a, l) { return a + l.pts; }, 0); }
    function lifetime() { return S.ledger.reduce(function (a, l) { return a + ((l.type === "earn" || l.type === "bonus") ? l.pts : 0); }, 0); }
    function tier() { var t = TIERS[0]; TIERS.forEach(function (x) { if (lifetime() >= x.min) t = x; }); return t; }
    function nextTier() { var t = tier(); return TIERS[TIERS.indexOf(t) + 1] || null; }
    function names(b) { return b.items.map(function (i) { return i.name; }).join(", "); }

    function quote(ids, size, pickup, usePts) {
      var mult = SIZES[size] || 1;
      var items = ids.map(function (id) { return SERVICES.filter(function (s) { return s.id === id; })[0]; }).filter(Boolean)
        .map(function (s) { return { id: s.id, name: s.name, price: Math.round(s.price * mult), days: s.days }; });
      var subtotal = items.reduce(function (a, i) { return a + i.price; }, 0);
      var rate = items.length >= 3 ? 0.1 : items.length === 2 ? 0.05 : 0;
      var discount = Math.round(subtotal * rate);
      var t = tier();
      var pickupFee = (pickup && t.name !== "Platinum") ? PICKUP_FEE : 0;
      var total = subtotal - discount + pickupFee;
      var maxRedeem = Math.max(0, Math.min(balance(), Math.floor((subtotal - discount) * 0.3)));
      var redeem = usePts ? maxRedeem : 0;
      total -= redeem;
      return { items: items, subtotal: subtotal, rate: rate, discount: discount, pickupFee: pickupFee, maxRedeem: maxRedeem, redeem: redeem, total: total, earn: Math.floor(total * 0.05 * t.mult), days: items.reduce(function (a, i) { return a + i.days; }, 0) };
    }

    function makeBooking(v, q, date, time, o) {
      o = o || {};
      var created = o.created || Date.now();
      return { id: uid("NA-"), vehicleId: v.id, vehicle: v.name, size: v.size, items: q.items, subtotal: q.subtotal, discount: q.discount, pickupFee: q.pickupFee, redeemed: q.redeem, total: q.total, earn: q.earn, pickup: !!o.pickup, date: date, time: time, notes: o.notes || "", stage: 0, cancelled: false, awarded: false, created: created, history: [{ stage: 0, t: created }] };
    }

    function seed(u) {
      var now = Date.now(), day = 864e5, today = todayISO();
      S = { user: { name: u.name, email: u.email, phone: u.phone || "" }, vehicles: [], bookings: [], ledger: [], vouchers: [], prefs: { sms: true, email: true, whatsapp: false, promos: false } };
      var v1 = { id: "V-CRETA", name: "Hyundai Creta", plate: "TN 22 AB 4821", size: "SUV", def: true };
      var v2 = { id: "V-BMW3", name: "BMW 3 Series", plate: "TN 09 CK 1107", size: "Sedan", def: false };
      S.vehicles.push(v1, v2);
      S.ledger.push({ id: uid("L"), t: now - 70 * day, label: "Welcome bonus", pts: 250, type: "bonus" });

      var d1 = nextOpenDate(addDays(today, -60));
      var b1 = makeBooking(v1, quote(["ceramic", "interior"], v1.size, false, false), d1, "11:00 AM", { created: now - 66 * day });
      b1.stage = 6; b1.awarded = true;
      b1.history = [0, 1, 2, 3, 4, 5, 6].map(function (s, i) { return { stage: s, t: now - (66 - i) * day }; });
      S.bookings.push(b1);
      S.ledger.push({ id: uid("L"), t: now - 60 * day, label: "Completed · " + names(b1), pts: b1.earn, type: "earn" });

      var b2 = makeBooking(v2, quote(["wheel", "engine"], v2.size, false, false), today, "09:00 AM", { created: now - 2 * day });
      b2.stage = 3;
      b2.history = [{ stage: 0, t: now - 2 * day }, { stage: 1, t: now - 1.6 * day }, { stage: 2, t: now - 6 * 36e5 }, { stage: 3, t: now - 2 * 36e5 }];
      S.bookings.push(b2);

      var b3 = makeBooking(v1, quote(["wash"], v1.size, false, false), nextOpenDate(addDays(today, 6)), "11:00 AM", { created: now - 3 * 36e5 });
      b3.stage = 1; b3.history = [{ stage: 0, t: now - 3 * 36e5 }, { stage: 1, t: now - 36e5 }];
      S.bookings.push(b3);
      save();
    }

    function load(u) {
      var raw = store.get(KEY), d = null;
      try { d = raw ? JSON.parse(raw) : null; } catch (e) { d = null; }
      if (d && d.user && d.user.email === u.email && Array.isArray(d.bookings)) {
        S = d;
        if (u.name && u.name !== d.user.name && !d.user.name) d.user.name = u.name;
      } else seed(u);
    }

    /* ---------- derived ---------- */
    function activeB() { return S.bookings.filter(function (b) { return !b.cancelled && b.stage < 6; }); }
    function upcomingB() {
      return S.bookings.filter(function (b) { return !b.cancelled && b.stage <= 1 && b.date >= todayISO(); })
        .sort(function (a, b) { return a.date.localeCompare(b.date) || slotHour(a.time) - slotHour(b.time); });
    }
    function currentB() {
      return activeB().sort(function (a, b) { return b.stage - a.stage || a.date.localeCompare(b.date); })[0] || null;
    }
    function doneB() { return S.bookings.filter(function (b) { return !b.cancelled && b.stage === 6; }); }
    function spend() { return doneB().reduce(function (a, b) { return a + b.total; }, 0); }

    /* ---------- slots ---------- */
    function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
    function slotStatus(d, t, ignore) {
      if (isSunday(d)) return "closed";
      if (S.bookings.some(function (b) { return !b.cancelled && b.id !== ignore && b.date === d && b.time === t; })) return "yours";
      if (d === todayISO() && slotHour(t) <= new Date().getHours()) return "past";
      if (hash(d + t) % 4 === 0) return "full";
      return "open";
    }
    var SLOT_LABEL = { open: "Available", full: "Fully booked", past: "Passed", yours: "Your booking", closed: "Closed" };

    function pickerShell(name) { return '<div class="dx-picker" data-picker="' + name + '"><div class="dx-dates"></div><p class="dx-hint"></p><div class="dx-slots"></div></div>'; }
    function pickerRender(ctx, root) {
      var dates = $(".dx-dates", root), slots = $(".dx-slots", root), hint = $(".dx-hint", root);
      var t = todayISO(), h = "";
      for (var i = 0; i < 21; i++) {
        var d = addDays(t, i), dd = parse(d), closed = isSunday(d);
        h += '<button type="button" class="dx-date' + (ctx.date === d ? " sel" : "") + '" data-date="' + d + '"' + (closed ? " disabled" : "") + '><small>' + dd.toLocaleDateString("en-IN", { weekday: "short" }) + '</small><b>' + dd.getDate() + '</b><small>' + (closed ? "Closed" : dd.toLocaleDateString("en-IN", { month: "short" })) + '</small></button>';
      }
      dates.innerHTML = h;
      if (!ctx.date) { slots.innerHTML = ""; hint.textContent = "Pick a date to see available slots."; return; }
      hint.textContent = "Slots for " + fmtDate(ctx.date) + " · studio hours 9 AM – 7 PM";
      slots.innerHTML = SLOTS.map(function (tm) {
        var st = slotStatus(ctx.date, tm, ctx.ignore);
        return '<button type="button" class="dx-slot' + (ctx.time === tm ? " sel" : "") + '" data-time="' + tm + '"' + (st === "open" ? "" : " disabled") + '>' + tm + '<small>' + SLOT_LABEL[st] + '</small></button>';
      }).join("");
    }

    /* ---------- booking draft ---------- */
    var D, R;
    function newDraft() {
      var dv = S.vehicles.filter(function (v) { return v.def; })[0] || S.vehicles[0];

    function confirmBook() {
      var v;
      if (D.vehicleId === "new") {
        if (!D.nvName.trim()) return toast("Enter your vehicle make and model");
        v = { id: uid("V-"), name: D.nvName.trim(), plate: D.nvPlate.trim().toUpperCase(), size: D.nvSize, def: S.vehicles.length === 0 };
      } else v = S.vehicles.filter(function (x) { return x.id === D.vehicleId; })[0];
      if (!v) return toast("Choose a vehicle");
      if (!D.services.length) return toast("Select at least one treatment");
      if (!D.date) return toast("Pick a date");
      if (!D.time) return toast("Pick a time slot");
      if (slotStatus(D.date, D.time) !== "open") { toast("That slot was just taken. Please pick another."); return; }
      var q = quote(D.services, v.size, D.pickup, D.usePts);
      if (D.vehicleId === "new") S.vehicles.push(v);
      var b = makeBooking(v, q, D.date, D.time, { pickup: D.pickup, notes: D.notes });
      S.bookings.push(b);
      if (q.redeem > 0) S.ledger.push({ id: uid("L"), t: Date.now(), label: "Redeemed on booking " + b.id, pts: -q.redeem, type: "redeem" });
      save(); D = newDraft();
      toast("Booking requested · " + b.id);
      go("services");
    }

    /* ---------- stage actions ---------- */
    function advance(id) {
      var b = S.bookings.filter(function (x) { return x.id === id; })[0];
      if (!b || b.cancelled || b.stage >= 6) return;
      var before = tier().name;
      b.stage++; b.history.push({ stage: b.stage, t: Date.now() });
      if (b.stage === 6 && !b.awarded) {
        b.awarded = true;
        if (b.earn > 0) S.ledger.push({ id: uid("L"), t: Date.now(), label: "Completed · " + names(b), pts: b.earn, type: "earn" });
        var after = tier().name;
        toast("Service completed · +" + num(b.earn) + " points" + (after !== before ? " · You reached " + after + "!" : ""));
      } else toast("Status updated: " + STAGES[b.stage]);
      save(); render();
    }
    function cancelBooking(id) {
      var b = S.bookings.filter(function (x) { return x.id === id; })[0];
      if (!b || b.stage > 1) return;
      b.cancelled = true; b.history.push({ stage: -1, t: Date.now() });
      if (b.redeemed > 0) S.ledger.push({ id: uid("L"), t: Date.now(), label: "Refund · cancelled " + b.id, pts: b.redeemed, type: "refund" });
      save(); closeModal(); toast("Booking cancelled"); render();
    }

    function badge(b) {
      if (b.cancelled) return '<span class="dx-badge bad">Cancelled</span>';

    function reminders() {
      var out = [], today = todayISO(), done = doneB();
      function last(ids) {
        var l = done.filter(function (b) { return b.items.some(function (i) { return ids.indexOf(i.id) > -1; }); }).sort(function (a, b) { return b.date.localeCompare(a.date); })[0];
        return l ? l.date : null;
      }
      function pending(id) { return activeB().some(function (b) { return b.items.some(function (i) { return i.id === id; }); }); }
      var c = last(["ceramic", "full"]);
      if (c && !pending("wash")) out.push({ title: "Coating maintenance wash", due: addDays(c, 30), svc: "wash" });
      var i = last(["interior", "full"]);
      if (i && !pending("interior")) out.push({ title: "Interior refresh", due: addDays(i, 180), svc: "interior" });
      if (c) out.push({ title: "Annual coating inspection", due: addDays(c, 365), svc: "wash" });
      return out.map(function (r) {
        var d = diffDays(r.due, today);
        r.label = d < 0 ? "Overdue by " + (-d) + (d === -1 ? " day" : " days") : d === 0 ? "Due today" : "Due in " + d + (d === 1 ? " day" : " days");
        r.cls = d < 0 ? "due-bad" : d <= 30 ? "due-warn" : "due-ok";
        return r;
      }).sort(function (a, b) { return a.due.localeCompare(b.due); });
    }

      return ev.sort(function (a, b) { return b.t - a.t; }).slice(0, 6);
    }

          '<button class="button button-outline button-small dx-danger" type="button" data-act="veh-del" data-id="' + v.id + '"' + (busy ? ' disabled title="Has an active booking"' : "") + '>Remove</button></div></article>';
      }).join("");
      var sizeOpts = Object.keys(SIZES).map(function (s) { return "<option>" + s + "</option>"; }).join("");
      return '<div class="dx-cars">' + (cars || '<section class="dx-card dx-empty"><p>Your garage is empty. Add a vehicle below.</p></section>') + '</div>' +
        '<section class="dx-card"><h3>Add a vehicle</h3><p class="dx-sub">Save your cars to book faster next time.</p><div class="dx-fields"><div><label class="dx-lab" for="gvName">Make and model</label><input id="gvName" placeholder="e.g. Audi Q5"></div><div><label class="dx-lab" for="gvPlate">Number plate (optional)</label><input id="gvPlate" placeholder="TN 00 AB 0000"></div><div><label class="dx-lab" for="gvSize">Size</label><select id="gvSize">' + sizeOpts + '</select></div></div><div class="dx-actions"><button class="button button-gold" type="button" data-act="veh-add">Add vehicle <span>↗</span></button></div></section>';
    };

    VIEWS.history = function () {
      var rows = S.bookings.filter(function (b) { return b.cancelled || b.stage === 6; }).sort(function (a, b) { return b.date.localeCompare(a.date); });
      if (!rows.length) return '<section class="dx-card dx-empty"><h3>No history yet</h3><p>Completed and cancelled bookings, with their invoices, will appear here.</p><button class="button button-gold" type="button" data-view="book">Book a slot <span>↗</span></button></section>';
      return '<section class="dx-card"><div class="dx-tablewrap"><table class="dx-table"><thead><tr><th>Date</th><th>Reference</th><th>Vehicle</th><th>Services</th><th>Total</th><th>Points</th><th>Status</th><th></th></tr></thead><tbody>' + rows.map(function (b) {
        return '<tr><td>' + fmtLong(b.date) + '</td><td>' + esc(b.id) + '</td><td>' + esc(b.vehicle) + '</td><td>' + esc(names(b)) + '</td><td>' + money(b.total) + '</td><td>' + (b.cancelled ? "—" : "+" + num(b.earn)) + '</td><td>' + badge(b) + '</td><td>' + (b.cancelled ? "" : '<button class="button button-outline button-small" type="button" data-act="invoice" data-id="' + b.id + '">Invoice</button>') + '</td></tr>';
      }).join("") + '</tbody></table></div></section>';
    };

    VIEWS.settings = function () {
      var p = S.prefs;
      function tog(k, title, desc) { return '<label class="dx-toggle"><span>' + title + '<small>' + desc + '</small></span><input type="checkbox" class="dx-switch" data-pref="' + k + '"' + (p[k] ? " checked" : "") + '></label>'; }
      return '<div class="dx-grid2" style="margin-bottom:0"><section class="dx-card"><h3>Profile</h3><p class="dx-sub">Used for booking confirmations and invoices.</p><div class="dx-fields"><div><label class="dx-lab" for="pfName">Full name</label><input id="pfName" value="' + esc(S.user.name) + '" autocomplete="name"></div><div><label class="dx-lab" for="pfPhone">Phone</label><input id="pfPhone" type="tel" placeholder="+91 98765 43210" value="' + esc(S.user.phone) + '" autocomplete="tel"></div><div class="full"><label class="dx-lab" for="pfEmail">Email address</label><input id="pfEmail" type="email" value="' + esc(S.user.email) + '" autocomplete="email"></div></div><div class="dx-actions"><button class="button button-gold" type="button" data-act="save-profile">Save changes <span>↗</span></button></div></section>' +
        '<section class="dx-card"><h3>Notifications</h3><p class="dx-sub">Choose how the studio reaches you.</p>' + tog("sms", "SMS updates", "Status changes and pickup alerts") + tog("email", "Email updates", "Confirmations and invoices") + tog("whatsapp", "WhatsApp photos", "Progress photos at each stage") + tog("promos", "Offers and studio notes", "Seasonal offers, no spam") + '</section></div>' +
        '<section class="dx-card" style="margin-top:22px"><h3>Account</h3><p class="dx-sub">This is a demo: your data lives in this browser only.</p><div class="dx-actions"><button class="button button-outline" type="button" data-act="signout">Sign out</button><button class="button button-outline dx-danger" type="button" data-act="reset">Reset demo data</button></div></section>';
    };

    /* ---------- render + routing ---------- */
    var view = "overview";
    function currentViewFromHash() { var h = location.hash.replace("#", ""); return VIEWS[h] ? h : "overview"; }
    function chrome() {
      var t = tier();
      $("#miniPts").textContent = num(balance());
      $("#miniTier").textContent = t.name + " tier";
      $("#uName").textContent = S.user.name;
      $("#uTier").textContent = t.name + " member";
      $("#uAvatar").textContent = S.user.name.split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase() || "N";
      $("#viewTitle").textContent = TITLES[view];
      document.title = TITLES[view] + " — NOIR Auto Atelier";
      $$(".dx-nav button").forEach(function (b) { b.classList.toggle("active", b.dataset.view === view); });
    }
    function render(top) {
      view = currentViewFromHash();
      $("#view").innerHTML = VIEWS[view]();
      chrome();
      if (view === "book") { pickerRender(D, $('[data-picker="book"]')); updateSummary(); }
      if (top) window.scrollTo(0, 0);
    }
    function go(v) {
      document.body.classList.remove("nav-open");
      if (location.hash === "#" + v) render(true); else location.hash = v;
    }
    window.addEventListener("hashchange", function () { render(true); });

    /* ---------- modal ---------- */
    function openModal(html) { $("#modalBody").innerHTML = html; $("#modal").hidden = false; }
    function closeModal() { $("#modal").hidden = true; $("#modalBody").innerHTML = ""; }

    function invoiceHTML(b) {
      var gst = b.total - b.total / 1.18;
      return '<p class="dx-id">INVOICE</p><h3>INV-' + esc(b.id) + '</h3><p class="dx-meta">NOIR Auto Atelier · Chennai, Tamil Nadu</p>' +
        '<ul class="dx-list" style="margin-top:16px"><li><span>Billed to</span><b>' + esc(S.user.name) + '</b></li><li><span>Vehicle</span><b>' + esc(b.vehicle) + ' (' + esc(b.size) + ')</b></li><li><span>Service date</span><b>' + fmtLong(b.date) + '</b></li></ul>' +
        '<ul class="dx-inv-lines">' + b.items.map(function (i) { return '<li><span>' + esc(i.name) + '</span><b>' + money(i.price) + '</b></li>'; }).join("") +
        (b.discount ? '<li><span>Bundle discount</span><b>− ' + money(b.discount) + '</b></li>' : "") + (b.pickupFee ? '<li><span>Doorstep pickup</span><b>' + money(b.pickupFee) + '</b></li>' : "") +
        (b.redeemed ? '<li><span>Points applied</span><b>− ' + money(b.redeemed) + '</b></li>' : "") + '</ul>' +
        '<div class="dx-total"><span>Total paid</span><strong>' + money(b.total) + '</strong></div><p class="dx-meta">Includes GST (18%): ' + money(gst) + ' · Points earned: ' + num(b.earn) + '</p>' +
        '<div class="dx-actions no-print"><button class="button button-gold" type="button" data-act="print">Print invoice <span>↗</span></button></div>';
    }

    /* ---------- events ---------- */
    document.addEventListener("click", function (e) {
      var pick = e.target.closest("[data-date],[data-time]");
      if (pick) {
        var root = pick.closest(".dx-picker");
        if (root) {
          var name = root.dataset.picker, ctx = name === "book" ? D : R;
          if (pick.dataset.date) { if (ctx.date !== pick.dataset.date) ctx.time = ""; ctx.date = pick.dataset.date; }
          if (pick.dataset.time) ctx.time = pick.dataset.time;
          pickerRender(ctx, root);
          if (name === "book") updateSummary();
          return;
        }
      }
      var v = e.target.closest("[data-view]");
      if (v) { go(v.dataset.view); return; }
      var a = e.target.closest("[data-act]");
      if (!a) { if (e.target === $("#modal")) closeModal(); return; }
      var act = a.dataset.act, id = a.dataset.id;
      if (act === "menu") document.body.classList.toggle("nav-open");
      else if (act === "close") closeModal();
      else if (act === "advance") advance(id);
      else if (act === "confirm-book") confirmBook();
      else if (act === "add-svc") { D = newDraft(); D.services = [a.dataset.svc]; go("book"); }
      else if (act === "book-for") { D = newDraft(); D.vehicleId = id; go("book"); }
      else if (act === "cancel") {
        openModal('<h3>Cancel this booking?</h3><p class="dx-sub">' + esc(id) + ' will be cancelled' + (S.bookings.filter(function (b) { return b.id === id; })[0].redeemed ? ", and your redeemed points will be refunded" : "") + '.</p><div class="dx-actions"><button class="button button-outline dx-danger" type="button" data-act="cancel-yes" data-id="' + id + '">Yes, cancel booking</button><button class="button button-outline" type="button" data-act="close">Keep booking</button></div>');
      }
      else if (act === "cancel-yes") cancelBooking(id);
      else if (act === "resched") {
        var b = S.bookings.filter(function (x) { return x.id === id; })[0];
        R = { id: id, date: "", time: "", ignore: id };
        openModal('<h3>Reschedule</h3><p class="dx-sub">' + esc(names(b)) + ' · currently ' + fmtDate(b.date) + ', ' + esc(b.time) + '</p>' + pickerShell("resched") + '<div class="dx-actions"><button class="button button-gold" type="button" data-act="resched-save" data-id="' + id + '">Save new slot <span>↗</span></button><button class="button button-outline" type="button" data-act="close">Cancel</button></div>');
        pickerRender(R, $('[data-picker="resched"]'));
      }
      else if (act === "resched-save") {
        if (!R.date || !R.time) return toast("Pick a new date and time");
        var bb = S.bookings.filter(function (x) { return x.id === id; })[0];
        if (slotStatus(R.date, R.time, id) !== "open") return toast("That slot is not available");
        bb.date = R.date; bb.time = R.time; save(); closeModal(); toast("Rescheduled to " + fmtDate(R.date) + ", " + R.time); render();
      }
      else if (act === "invoice") { openModal(invoiceHTML(S.bookings.filter(function (x) { return x.id === id; })[0])); }
      else if (act === "print") window.print();
      else if (act === "redeem") {
        var r = REWARDS.filter(function (x) { return x.id === id; })[0];
        if (!r || balance() < r.cost) return toast("Not enough points yet");
        S.ledger.push({ id: uid("L"), t: Date.now(), label: "Redeemed · " + r.name, pts: -r.cost, type: "redeem" });
        S.vouchers.unshift({ id: uid("V"), code: "NOIR-" + Math.random().toString(36).slice(2, 6).toUpperCase() + "-" + Math.random().toString(36).slice(2, 6).toUpperCase(), name: r.name, t: Date.now(), used: false });
        save(); toast("Reward redeemed: " + r.name); render();
      }
      else if (act === "voucher-used") { S.vouchers.forEach(function (x) { if (x.id === id) x.used = true; }); save(); render(); }
      else if (act === "copy-ref") {
        var code = a.dataset.code;
        (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { toast("Referral code copied"); }, function () { toast(code); });
      }
      else if (act === "veh-default") { S.vehicles.forEach(function (x) { x.def = x.id === id; }); save(); render(); toast("Default vehicle updated"); }
      else if (act === "veh-del") {
        S.vehicles = S.vehicles.filter(function (x) { return x.id !== id; });
        if (S.vehicles.length && !S.vehicles.some(function (x) { return x.def; })) S.vehicles[0].def = true;
        save(); render(); toast("Vehicle removed");
      }
      else if (act === "veh-add") {
        var nm = $("#gvName").value.trim(); if (!nm) return toast("Enter the vehicle make and model");
        S.vehicles.push({ id: uid("V-"), name: nm, plate: $("#gvPlate").value.trim().toUpperCase(), size: $("#gvSize").value, def: S.vehicles.length === 0 });
        save(); render(); toast("Vehicle added");
      }
      else if (act === "save-profile") {
        var n = $("#pfName").value.trim(), em = $("#pfEmail").value.trim();
        if (!n) return toast("Please enter your name");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return toast("Please enter a valid email");
        S.user.name = n; S.user.email = em; S.user.phone = $("#pfPhone").value.trim();
        save(); store.set("noir-user", JSON.stringify({ name: n, email: em, phone: S.user.phone })); chrome(); toast("Profile saved");
      }
      else if (act === "reset") { store.del(KEY); location.reload(); }
      else if (act === "signout") { store.del("noir-user"); location.href = "index.html"; }
    });

    document.addEventListener("change", function (e) {
      var t = e.target;
      if (t.name === "veh") { D.vehicleId = t.value; $("#nvBox").hidden = t.value !== "new"; $("#svcGrid").innerHTML = svcGridHTML(); updateSummary(); }
      else if (t.dataset && t.dataset.svc) {
        var id = t.dataset.svc, i = D.services.indexOf(id);
        if (t.checked && i < 0) D.services.push(id); else if (!t.checked && i > -1) D.services.splice(i, 1);
        if (t.checked) {
          var parts = ["ceramic", "correction", "interior"];
          if (id === "full") D.services = D.services.filter(function (x) { return parts.indexOf(x) < 0; });
          else if (parts.indexOf(id) > -1) D.services = D.services.filter(function (x) { return x !== "full"; });
          $("#svcGrid").innerHTML = svcGridHTML();
        }
        updateSummary();
      }
      else if (t.hasAttribute && t.hasAttribute("data-pickup")) { D.pickup = t.checked; updateSummary(); }
      else if (t.hasAttribute && t.hasAttribute("data-usepts")) { D.usePts = t.checked; updateSummary(); }
      else if (t.id === "nvSize") { D.nvSize = t.value; $("#svcGrid").innerHTML = svcGridHTML(); updateSummary(); }
      else if (t.dataset && t.dataset.pref) { S.prefs[t.dataset.pref] = t.checked; save(); toast("Preference saved"); }
    });
    document.addEventListener("input", function (e) {
      var t = e.target;
      if (t.id === "nvName") { D.nvName = t.value; updateSummary(); }
      else if (t.id === "nvPlate") D.nvPlate = t.value;
      else if (t.id === "notes") D.notes = t.value;
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { closeModal(); document.body.classList.remove("nav-open"); }
    });
    $("#scrim").addEventListener("click", function () { document.body.classList.remove("nav-open"); });

    /* ---------- boot ---------- */
    var user = readUser();
    /* Dashboard is a separate page: it opens directly, no login redirect. */
    load(user);
    D = newDraft();
    render(false);
  })();
  </script>
</body>

</html>
